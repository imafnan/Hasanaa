services:
  - type: web
    name: hasanaa-backend
    env: node
    plan: free
    # Specify the root directory as '.' so pnpm workspace resolves all dependencies
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: hasanaa2024
      - key: ALLOWED_ORIGINS
        value: "*" # Replace with your Vercel frontend URL once deployed
      - key: STORAGE_PROVIDER
        value: local # Change to 'cloudinary' in production
      - key: MONGODB_URI
        value: "" # Set this in Render's Dashboard Environment settings
